    text: Nexus 同一运行模式下的 TuffEx 自动注册、显式组件和工具模块来自同一套实现。生产预览的 Toast Demo 能展示提示，Overlay
      共用层级管理，不出现 source/dist 分裂导致的交互失效。
    result: pending
    reason: null
