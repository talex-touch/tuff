    - id: focus-clean-shutdown-correlation
      name:
        text: 实际退出取消1～10及汇总完整HTTP200/Nexusaccepted
        truncated: false
      argv_display:
        - text: -c
          truncated: false
        - text: |
            import pathlib,json,re
            root=pathlib.Path("/private/tmp/tuff-focus-runtime-20261004/evidence")
            id="2481f41e-047b-4260-8260-0110e7cf56e6"
            sentry=[]; nexus=[]
            for path in sorted(root.glob("*.json")):
             d=json.loads(path.read_bytes())
             for x in d.get("sentryDeliveries",[]):
              if x.get("context",{}).get("summonId")==id: sentry.append({"file":path.name,"statusCode":x.get("statusCode"),"context":x.get("context")})
             for x in d.get("nexusDeliveries",[]):
              if not x.get("events") or x.get("status")!=200: continue
              es=json.loads(x["events"])["events"]; ack=json.loads(x.get("data","{}"))
              if ack.get("accepted")!=len(es) or ack.get("rejected",0) or ack.get("dropped",0): continue
              for e in es:
               if e.get("metadata",{}).get("summonId")==id: nexus.append({"file":path.name,"metadata":e["metadata"]})
            print("SHUTDOWN_SENTRY",json.dumps(sentry,separators=(",",":")))
            print("SHUTDOWN_NEXUS_ACCEPTED",json.dumps(nexus,separators=(",",":")))
            expected=set(range(1,11))
            assert {x["metadata"]["sampleIndex"] for x in nexus if x["metadata"]["stage"]=="sample"}==expected
            assert any(x["metadata"]["stage"]=="cancel" for x in nexus)
            assert {x["context"]["sampleIndex"] for x in sentry if x.get("statusCode")==200 and x["context"]["stage"]=="sample"}==expected,"A4 shutdown cancellation has no Sentry HTTP200 receipt for 1-10"
            assert any(x.get("statusCode")==200 and x["context"]["stage"]=="cancel" for x in sentry),"A4 shutdown cancellation summary has no Sentry HTTP200 receipt"
