acceptance:
  - id: A1
    source: brief.md
    text: "`TxTerminal` 在真实浏览器中显示 ANSI
      颜色、中文和连续输出；交互模式提供键盘输入，容器改变尺寸时正确适配，主题随宿主更新，卸载后释放实例和观察器。组件不要求 Electron 环境。"
    result: passed
    reason:
      text: 独立核对 terminal/src/TxTerminal.vue
        的客户端动态导入、有序输出队列、输入/readOnly门禁、fit/主题订阅与卸载释放。真实保存证据
        /tmp/tuff-terminal-smoke/browser-{initial,actions,cleanup,theme-final}.json
        与 component-before/after.png
        显示ANSI/中文、abc\r输入、92→53列、255→20背景、清空及卸载；Runtime tuffex-contracts
        的11项组件/SSR/suite合同通过。未将组件测试中的xterm替身作为浏览器证据。
      truncated: false
  - id: A2
    source: brief.md
    text: Electron 中显式打开交互式终端后，子进程观察到真实
      TTY；普通输入、Ctrl+C、尺寸变化和退出状态真实生效。可执行文件缺失时返回明确失败，不降级为管道进程或假成功。
    result: passed
    reason:
      text: 核对主进程 terminal/index.ts → pty-session-core.ts
        生产node-pty.create/spawn及write/resize/close路由，缺失可执行文件在native
        spawn前明确失败，无管道降级。保存的 native-evidence.json 与
        native-probe.mjs/pty-child.cjs 证明TTY=true、真实输入、71x19
        resize、Ctrl+C退出130、PID不可存活及missingRejected；host-entry/compile-host/electron-main加载生产channel/module/preload和真实node-pty，profile仅/tmp。
      truncated: false
  - id: A3
    source: brief.md
    text: 新 typed SDK
      的会话创建、订阅与关闭覆盖快速输出和快速退出：首段及末段输出不丢失，不截断较大的输出块。退出、关闭、组件卸载和窗口销毁后，进程及订阅释放，重复关闭不重复通知或释放。
    result: passed
    reason:
      text: 新 terminal domain SDK
        在create前订阅data/exit，缓存按会话ID有序回放；creationToken处理未消费ACK取消，core等待native
        onExit后统一dispose，close可重复且仅一次终止/通知。Runtime追加
        verifier-core-terminal-regressions(97项) 与
        verifier-utils-terminal-regressions(85项)通过，覆盖快速输出/退出、100k单块、首末段、失去ACK、卸载、native退出屏障与重复close；真实证据
        native-evidence.json
        的48000字符及终段完整、close后PID不存在，native-extra-evidence.json
        的sender销毁及sessions/creationCount归零佐证真实清理。
      truncated: false
  - id: A4
    source: brief.md
    text: 创建、输入、resize 和关闭均保留 `system.shell` 权限与可信调用方校验。两个窗口或插件不能操作彼此的会话，猜测会话 ID
      不能绕过隔离。身份或权限不满足时，不先启动子进程。
    result: passed
    reason:
      text: 独立追踪 TerminalModule四个控制注册全部经过system.shell
        withPermission和可信transport身份，core owner绑定具体sender/scope/plugin
        activation，不依赖payload声明；notifyTo→channel.broadcastTo→renderer.on消费路由已核对。Runtime两个追加合同通过，覆盖权限denied/unavailable、未验证身份在spawn前拒绝、跨plugin/window同ID及token拒绝、revoked
        activation清理与定向通知。真实native
        smoke仅直接覆盖跨窗口write拒绝，其余权限/resize/close隔离由源码和合同证据证明，未冒充真实插件运行。
      truncated: false
  - id: A5
    source: brief.md
    text: AI CLI 面板使用 `TxTerminal` 和共用 PTY 核心；Provider 可执行文件、访问等级、项目工作目录、原生会话恢复与
      lease 的既有约束保持。切换会话或关闭面板后，旧进程退出，迟到输出不能进入新会话。
    result: passed
    reason:
      text: LocalAiCliPanel使用TxTerminal；local-ai-cli主进程createTerminal交给共用ptySessionCore，保留Provider
        executable/feature/access、项目canonical
        cwd、sessionRef恢复/归属/能力和native-session
        lease门禁；onDispose只在真实exit后释放lease。面板generation、创建取消、早期事件按ID过滤及reset/unmount清理阻止迟到输出。Runtime
        core-terminal追加检查中的AI
        index及panel合同全部通过，覆盖恢复门禁、安全args/cwd、kill/exit/destroy
        lease释放与会话切换。未执行付费Provider新任务，不将合同替身当作Provider真实运行证据。
      truncated: false
  - id: A6
    source: brief.md
    text: 插件日志通过 `TxTerminal` 的只读模式显示；增量追加、历史切换、清空、暂停和自动滚动保持正确。显示日志不创建
      PTY、不发送输入，也不主动抢焦点。
    result: passed
    reason:
      text: PluginLogs.vue只向TxTerminal传lines/read-only/auto-scroll，没有PTY创建、输入事件或焦点调用；既有handleLogStream暂停与历史选择、clearLogs保持，组件prefix增量/替换reset及viewport逻辑已核对。Runtime
        tuffex-contracts通过，包含日志追加/原地编辑/历史切换/清空、readonly禁止输入与autofocus、关闭autoscroll保留viewport。浏览器保存证据readonlyPreserved=true、可见历史替换及清空佐证真实显示；完整正常Tuff插件日志页未逐页现场巡检。
      truncated: false
