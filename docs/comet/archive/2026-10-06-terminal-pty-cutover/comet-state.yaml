    source: brief.md
    text: 插件创建页的 Node/degit 检测和显式安装入口使用新 SDK，不再依赖旧 `Terminal`
      类。检测完成、失败或超时后释放资源；安装命令只在用户明确操作后执行，以独立 command/args 传入并显示真实输出与退出结果。
    result: passed
    reason:
      text: EnvDetector通过createTerminalSdk传独立command/args，并只在成功退出且有有效输出后返回Node/degit状态；2秒超时abort并等待清理，失败不伪装可用。PluginNew安装入口显式弹出TerminalTemplate(command=npm,args=[install,-g,degit])，模板仅Start点击创建，卸载/Stop取消pending或active会话。Runtime
        terminal-env与TerminalTemplate合同通过；native-extra-evidence.json及native-extra.mjs证明实际生产模板经用户点击执行无副作用/usr/bin/printf，显示真实中文输出与exit0。没有执行全局npm安装。
