acceptance:
  - id: A1
    source: brief.md
    text: 概览和设备页使用现有 TuffEx 地图展示有效坐标、标签和数值，无坐标时显示本地化空态。点选事件仍能返回对应记录，页面不再请求
      Leaflet/unpkg 或 OpenStreetMap 瓦片。
    result: passed
    reason:
      text: "Passed by independent source/consumer review plus current Runtime maps
        and real Dashboard consumer tests (17+4), map-runtime.json,
        map-localized-empty.json and map-responsive-sizing.json: finite
        coordinate filtering, original record bubble-click to point-click
        forwarding, safe text labels/value/color, reactive positions, actual
        pan/zoom, localized empty states and no Leaflet/unpkg/OSM requests.
        Dashboard callers retain lazy mounting and expose coordinate-free empty
        state. Browser evidence is the actual GeoBubbleMap component at 8839,
        not an authenticated backend end-to-end claim; ResizeObserver cleanup
        verified in use-map-base.ts."
      truncated: false
  - id: A2
    source: brief.md
    text: 中英文 Developer、Concepts 和组件目录页均可直接访问、站内导航及前进后退。有效目录及其 index 拼写具有对应静态
      HTML、JSON 和 Markdown，不再误报 Document not found；不存在的文档仍返回真实未找到结果。
    result: passed
    reason:
      text: "Passed: canonicalDocsPageIdentity is consumed by route-record validation,
        request cache and full-body cache; existing prerender/index alias
        pipeline retained. static-http-delivery.json records both languages for
        docs root, Developer and Concepts/components directory:
        HTML/Markdown/body JSON 200, directory/index matching bodies, unknown
        HTML/JSON 404 and legacy /docs/dev 308. spa-navigation-and-cache.json
        demonstrates actual uncached directory navigation plus Back/Forward
        preserving corresponding readable content."
      truncated: false
  - id: A3
    source: brief.md
    text: 文档 URL、正文、侧栏、目录、周边 UI 和 Demo
      文案使用一致语言。中英往返、刷新及快速切换后以最后路由为准，链接保留语言，不展示未翻译键，不被浏览器或账户偏好切回另一种语言。
    result: passed
    reason:
      text: "Passed: LanguageToggle preserves query/hash while navigating localized
        document identity; the consuming locale queue checks explicit route
        language after message loading, and profile sync checks before and after
        its async fetch. Current 25 Runtime locale tests cover conflicting and
        late preferences; locale-roundtrip.json and
        rapid-locale-final-owner.json record Chinese selection/refresh and
        zh/en/zh/en ending with English URL, title, navigation, language button
        and real Toast Demo labels, without untranslated keys. Direct document
        navigation does not invoke manual account preference updates."
      truncated: false
  - id: A4
    source: brief.md
    text: 仅包含动态组件导入的模块不会提前加载这些组件的 CSS。激活组件时加载其样式及完整依赖，静态导入仍有正确样式，既有显式 CSS 导入不重复下载。
    result: passed
    reason:
      text: "Passed: reviewed AST ImportDeclaration/ImportExpression routing and both
        generic and componentDistRoot execution paths; lazy styles are loaded
        within the dynamic boundary, with dependency-first full closure and
        module-level deduplication. Current Runtime 10 tests execute actual Vite
        output for both modes, checking cold registry, activated closure, shared
        dependencies, explicit CSS deduplication and type/string/comment
        exclusion. Current production resource sample retains only needed page
        dependencies; no full stylesheet fallback was added."
      truncated: false
  - id: A5
    source: brief.md
    text: Nexus 同一运行模式下的 TuffEx 自动注册、显式组件和工具模块来自同一套实现。生产预览的 Toast Demo 能展示提示，Overlay
      共用层级管理，不出现 source/dist 分裂导致的交互失效。
    result: passed
    reason:
      text: "Passed: Nuxt automatic registration and explicit component/utils aliases
        share the same source/dist mode; traced Toast host consumption to
        toastStore and Overlay consumers to the common z-index-manager module.
        production-toast.json records real Success -> Saved notification;
        clean-toast-observation.json records the clean rebuild interaction and
        completed visibility wait. Actual repeated language dropdown
        opening/selection/closing also works. No bridge or duplicate state queue
        introduced; final screenshot timeout is not counted as visual evidence."
      truncated: false
  - id: A6
    source: brief.md
    text: 未缓存的站内文档切换通过一个完整正文响应取得元数据和正文，不先等待 meta 请求再等待
      body。已缓存页面复用结果，快速导航或切语言时旧响应不会覆盖新页面，失败保留明确错误和现有重试入口。
    result: passed
    reason:
      text: "Passed: page SSR/hydration and SPA use body=1; sidebar/pager no longer
        issue metadata requests. Reviewed canonical locale-aware caches, pending
        request joining, route/generation stale guards around awaits/backoff,
        page-local state and bounded retry/error UI.
        spa-navigation-and-cache.json records one body JSON for uncached
        Developer/Concepts and zero requests on cached Back/Forward;
        checkbox-and-transport-error.json and transport-error-retry.json show
        explicit error (not false 404), settled bounded denials and one-response
        Retry recovery. late-navigation-response.json releases a real delayed
        200 after returning to Toast without replacing the final page. Current
        Runtime cache tests also preserve production 404 versus transport error
        semantics."
      truncated: false
  - id: A7
    source: brief.md
    text: 文档首屏只加载公共页面壳、本页组件和实际依赖，不加载其他文档的 Demo 或其重型依赖。滚动激活及重置本页 Demo
      后交互、样式和语言仍正确，页面之间不会携带整份 Demo 注册表作为首屏依赖。
    result: passed
    reason:
      text: "Passed: traced registry build parsing -> emitted versioned loader ->
        runtime dynamic import -> renderer default component and instance-change
        -> wrapper reset handler. Manual chunk isolation and non-entry manifest
        flags keep Demo implementations out of shared startup. Current Runtime
        Vite integration test measures loaded implementation ownership including
        silent unrelated modules, and production-resource-graph.log inspects
        actual clean Button JS: only ButtonVariantsDemo and ButtonDisabledDemo
        implementations. Real Checkbox mouse, reset and keyboard Space evidence
        and retained Terminal Demo evidence confirm interactions are not mocked
        away; body/code remain static and the full registry is
        development-only."
      truncated: false
  - id: A8
    source: brief.md
    text: 生产预渲染的中英文文档在禁用 JavaScript 时已有标题、正文和代码。恢复 JavaScript
      后正文保留，首屏不重新请求正文；canonical、alternate、静态缓存规则和既有 URL 形态保持正确。
    result: passed
    reason:
      text: "Passed: complete body mode and fetch key are shared by SSR/hydration, and
        body seeding suppresses duplicate requests. ssg-no-javascript.json
        records six real script-disabled English/Chinese Button and directory
        pages with titles/body, Button code blocks, production canonical and
        en/zh-CN/x-default alternates. Clean before/after production browser
        samples keep readable Button content and zero initial body requests.
        static-http-delivery.json plus unchanged static delivery pipeline and
        current budget sub-check output confirm 300-second public cache, JSON
        MIME, real 404, 308 entry redirect and static route ownership; private
        engagement/account APIs are not added to public caching. Overall budget
        command is failed, not passed."
      truncated: false
  - id: A9
    source: brief.md
    text: 在真实浏览器回归地图、目录、语言、普通组件页及 Toast Demo。用同一构建模式和缓存条件比较优化前后请求数、CSS/JS
      资源和串行等待，分别报告本地与线上边界，不把开发模块数量或历史部署问题当成当前生产收益。
    result: passed
    reason:
      text: "Passed for the complete confirmed evidence/reporting criterion, not a
        claim that every metric improves: current unchanged candidate has real
        Pages browser directory/locale/ordinary component/Toast interactions
        plus actual map component browser operations. Same Node/build entry and
        clean production mode, viewport 1799x1209, disabled cache/service-worker
        bypass, and five seconds after first live Demo form one cold pair.
        Runtime graph output records 111 -> 121 requests, CSS 123447 -> 112532
        encoded bytes and JS 487753 -> 459867 encoded bytes, zero initial body
        requests; SPA evidence separately records one complete response versus
        cached zero and no meta/body serial chain. Both clean original full-site
        budget commands fail (89.43 -> 91.18 MiB against unchanged 60 MiB) and
        full-site typechecks fail (candidate 6/baseline 12); these are
        explicitly retained constraints in brief line 76, not hidden passes or
        reduced acceptance scope. No deployment, edge-cache, Early Hints or
        online latency benefit is asserted."
      truncated: false
