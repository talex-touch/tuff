        - text: >-
            const fs=require('node:fs'),path=require('node:path');

            const [root,beforePath,afterPath]=process.argv.slice(1);

            const observations=[];

            for(const [phase,samplePath] of
            [['before',beforePath],['after',afterPath]]){
             const sample=JSON.parse(fs.readFileSync(samplePath,'utf8'));
             observations.push({phase,viewport:sample.viewport,requests:sample.resources.length,jsCount:sample.js.length,jsBytes:sample.js.reduce((n,x)=>n+x.bytes,0),cssCount:sample.css.length,cssBytes:sample.css.reduce((n,x)=>n+x.bytes,0),bodyRequests:sample.bodyRequests,loaders:sample.loaders});
             if(phase==='after'){
              const modules=sample.js.map(x=>{const code=fs.readFileSync(path.join(root,x.path),'utf8');return {path:x.path,names:[...code.matchAll(/(?:__name|name):"([A-Za-z][A-Za-z0-9_-]*)"/g)].map(m=>m[1])};});
              const demos=modules.flatMap(x=>x.names.filter(n=>n.endsWith('Demo')).map(name=>({path:x.path,name})));
              console.log(JSON.stringify({modules,demos}));
              if(demos.some(x=>!x.name.startsWith('Button')))process.exitCode=1;
             }
            }

            console.log(JSON.stringify({observations}));
