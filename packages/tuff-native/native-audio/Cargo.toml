[package]
name = "tuff-native-audio"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]
name = "tuff_native_audio"

[dependencies]
cpal = "0.18"
enigo = "0.6"
hound = "3.5"
napi.workspace = true
napi-derive.workspace = true
nnnoiseless = { version = "0.5.2", default-features = false }
symphonia = { version = "0.5", features = ["mp3", "wav", "pcm"] }


[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.4", default-features = false, features = ["std"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFMachPort", "CFNumber", "CFRunLoop", "CFSet", "CFString"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation"] }
objc2-io-kit = { version = "=0.3.2", default-features = false, features = ["std", "hid"] }

[build-dependencies]
napi-build.workspace = true
