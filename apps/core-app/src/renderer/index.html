<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Fallback enforcing Content-Security-Policy matching `main/core/renderer-csp.ts` (#689).
      The main process attaches the authoritative enforcing policy (including header-only
      `frame-ancestors 'none'` and worker coverage) via `session.defaultSession.webRequest.onHeadersReceived`.
      During Vite dev (`electron-vite` serve mode), `electron.vite.config.ts` appends narrow
      loopback HMR sources to `connect-src` so this static file and production builds stay strict.

      Narrow remaining allowances (each empirically required at runtime):
      - `script-src` carries `'unsafe-eval'` because official CoreBox plugin widgets
        (`touch-intelligence`, `touch-translation`) execute compiled code through `new Function`
        in `widget-registry.ts`; replacing that executor is its own change. `blob:` is required by
        `widget-sandbox/sandbox-document.ts` (`await import(blobRuntimeUrl)` inside an inherited
        `<iframe srcdoc>`). Neither `*`, `'unsafe-inline'`, nor `data:` is permitted.
      - `connect-src` routes all AI/Nexus/Store/MCP HTTP traffic through main-process IPC, so the
        renderer itself only reaches `'self'`, Sentry ingest, and local `blob:`/`data:`/`tfile:`.
      - `img-src` allows `https:` (not `*` or plaintext `http:`) for account/Git avatars, store
        plugin icons, browser favicons, and markdown images.
      - `style-src`/`style-src-elem` allow `'unsafe-inline'` for Vue `:style` bindings, UnoCSS,
        and dynamic `<style>` injection in `widget-registry.ts`, with no remote wildcard.
      - `frame-src` allows `blob:` only (for `WorkspaceFileViewer.vue` PDF preview); `about:srcdoc`
        sandboxed previews are permitted by CSP3 and all remote/file/data frames are blocked.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
    default-src 'self' tfile:;
    script-src 'self' 'unsafe-eval' blob:;
    connect-src 'self' https://o4508024637620224.ingest.us.sentry.io blob: data: tfile:;
    img-src 'self' https: data: blob: tfile: file:;
    font-src 'self' data: blob:;
    style-src 'self' 'unsafe-inline' blob: data:;
    style-src-elem 'self' 'unsafe-inline' blob: data:;
    media-src 'self' blob: data: tfile:;
    object-src 'none';
    frame-src blob:;
    worker-src 'self' blob:;
    base-uri 'self';
    form-action 'self';
  "
    />

    <!--
      Never deliver a report-only CSP or `frame-ancestors` via `<meta>`: Chromium ignores both
      there. Header-level enforcement and worker coverage live in `main/core/renderer-csp.ts` (#689).
    -->

    <title>Tuff</title>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
