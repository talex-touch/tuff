name = "tuff"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat", "enable_nodejs_http_modules", "no_nodejs_compat_v2"]
pages_build_output_dir = "apps/nexus/dist"

# Smart Placement: run the Functions Worker next to what it calls most. Every API request makes
# several D1 round trips to the primary in APAC; served from LAX/AMS (where CN traffic lands) each one
# cost 150–250 ms, placed beside D1 a few. Verify with the `cf-placement` response header.
[placement]
mode = "smart"

[env.production]
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat", "enable_nodejs_http_modules", "no_nodejs_compat_v2"]

[env.production.placement]
mode = "smart"

[[env.production.d1_databases]]
binding = "DB"
database_name = "tuff-nexus-prod"
database_id = "ebdeb7fc-74a4-4963-9bca-310a9aa0e4d6"

[[env.production.r2_buckets]]
binding = "R2"
bucket_name = "tuff-nexus-imgable-prod"

[[env.production.kv_namespaces]]
binding = "TUFF_INTELLIGENCE_RUNTIME"
id = "8c235ea8b96d4209bed631ee6c698803"

[env.production.vars]
NODE_OPTIONS = "--max-old-space-size=6144"
AUTH_ORIGIN = "https://tuff.tagzxia.com"
AUTH_EMAIL_FROM = "tuff@tagzxia.com"
LINUXDO_ISSUER = "https://connect.linux.do"
ADMIN_BREAKGLASS_ENABLED = "false"
ADMIN_CONTROL_PLANE_PROTECTED_ENABLED = "false"
ADMIN_DUAL_CONTROL_ENABLED = "false"
ADMIN_PRESERVE_IN_EXTREME_ENABLED = "false"
ADMIN_EMERGENCY_ISSUER_VERSION = "v1"
ADMIN_OOB_MTLS_ENABLED = "false"
ADMIN_OOB_MTLS_FINGERPRINTS = ""
ADMIN_DEFAULT_DEFENSE_MODE = "NORMAL"
EXCHANGE_RATE_BASE_URL = "https://v6.exchangerate-api.com/v6"
EXCHANGE_RATE_TTL_MS = "28800000"
EXCHANGE_RATE_TIMEOUT_MS = "10000"
EXCHANGE_RATE_HISTORY_RETENTION_DAYS = "0"
EXCHANGE_RATE_STORE_RATE_ROWS = "true"
# `Server-Timing: d1;desc="N round trips";dur=…` on responses (server/plugins/d1-server-timing.ts).
NEXUS_SERVER_TIMING = "1"
# Source map upload (NUXT_ENABLE_SENTRY_SOURCEMAPS = "true", nuxt.config.ts `sentry`) is off: with it
# the production build of 63e424b ran past Pages' build time limit and was terminated after 36 minutes
# (2026-10-09), where the build before it took 25.6 minutes without maps. Turn it back on only with the
# build comfortably inside the limit.

[env.preview]
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat", "enable_nodejs_http_modules", "no_nodejs_compat_v2"]

[env.preview.placement]
mode = "smart"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "tuff-nexus-dev"
database_id = "963cd4ae-2a63-408d-b3bc-fa5945f1e878"

[env.preview.vars]
NODE_OPTIONS = "--max-old-space-size=6144"
AUTH_ORIGIN = "http://localhost:3200"
AUTH_EMAIL_FROM = "tuff@tagzxia.com"
GITHUB_CLIENT_ID = ""
LINUXDO_CLIENT_ID = ""
ADMIN_BREAKGLASS_ENABLED = "false"
ADMIN_CONTROL_PLANE_PROTECTED_ENABLED = "false"
ADMIN_DUAL_CONTROL_ENABLED = "false"
ADMIN_PRESERVE_IN_EXTREME_ENABLED = "false"
ADMIN_EMERGENCY_ISSUER_VERSION = "v1"
ADMIN_CF_ACCESS_CLIENT_ID = ""
ADMIN_OOB_MTLS_ENABLED = "false"
ADMIN_OOB_MTLS_FINGERPRINTS = ""
ADMIN_DEFAULT_DEFENSE_MODE = "NORMAL"
NEXUS_SERVER_TIMING = "1"

[[env.preview.r2_buckets]]
binding = "R2"
bucket_name = "tuff-nexus-imgable-dev"

[[env.preview.kv_namespaces]]
binding = "TUFF_INTELLIGENCE_RUNTIME"
id = "77c5f7ddc0014c49b0b5977b23e599e3"
