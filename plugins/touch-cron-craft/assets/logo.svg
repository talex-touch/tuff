<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cronBg" x1="10" y1="10" x2="118" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="cronRing" x1="26" y1="24" x2="102" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#cronBg)"/>
  <!-- Outer precision ring -->
  <circle cx="64" cy="64" r="40" stroke="url(#cronRing)" stroke-width="6.5" stroke-dasharray="188 26" stroke-linecap="round"/>
  <!-- 5 cron field tick marks around clock -->
  <circle cx="64" cy="24" r="3.5" fill="#38BDF8"/>
  <circle cx="104" cy="64" r="3.5" fill="#34D399"/>
  <circle cx="64" cy="104" r="3.5" fill="#818CF8"/>
  <circle cx="24" cy="64" r="3.5" fill="#FBBF24"/>
  <!-- Clock hands -->
  <path d="M64 64V42" stroke="#F8FAFC" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M64 64L82 74" stroke="#34D399" stroke-width="6.5" stroke-linecap="round"/>
  <circle cx="64" cy="64" r="5.5" fill="#FBBF24"/>
  <!-- Repeat arrow tip -->
