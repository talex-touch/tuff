name: Tuffex Package Publish

on:
  push:
    branches:
      - master
      - main
    paths:
      - "packages/tuffex/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/package-publish.config.mjs"
      - "scripts/validate-publish-manifests.mjs"
      - "scripts/publish-package.mjs"
      - ".github/workflows/package-tuffex-publish.yml"

jobs:
  publish:
    name: Publish - tuffex
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PNPM
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version bump
        id: version_check
        run: |
          set -e
          current_version=$(node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('packages/tuffex/package.json','utf8')); console.log(pkg.version)")
          before_sha="${{ github.event.before }}"

          echo "current_version=$current_version" >> "$GITHUB_OUTPUT"

          if npm view "@talex-touch/tuffex@${current_version}" version >/dev/null 2>&1; then
            npm_has_version=true
          else
            npm_has_version=false
          fi
          echo "npm_has_version=${npm_has_version}" >> "$GITHUB_OUTPUT"

          if [ "$before_sha" = "0000000000000000000000000000000000000000" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A force-push (or any branch rewrite) leaves github.event.before pointing at a
          # commit that is not in the fetched history. Under `set -e`/pipefail an
          # unguarded `git show` then fails the whole version check, so a real version
          # bump in that same push is silently never published. Treat an unreachable
          # before-sha as "no previous version", matching package-tuff-cli-publish.yml.
          if git cat-file -e "$before_sha^{commit}" >/dev/null 2>&1; then
            previous_version=$(git show "$before_sha:packages/tuffex/package.json" 2>/dev/null | node -e "const fs=require('fs'); const input=fs.readFileSync(0,'utf8'); if(!input){process.exit(0)}; const pkg=JSON.parse(input); console.log(pkg.version)" || true)
          else
            echo "Previous commit $before_sha is unreachable (force-push?); treating as no previous version."
            previous_version=""
          fi
          echo "previous_version=$previous_version" >> "$GITHUB_OUTPUT"

          if [ "$current_version" != "$previous_version" ] || [ "${npm_has_version}" != "true" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip publish (version unchanged and already on npm)
        if: steps.version_check.outputs.should_publish != 'true'
        run: echo "Tuffex version unchanged and already published. Skipping publish."

      - name: Build package
        if: steps.version_check.outputs.should_publish == 'true'
        working-directory: packages/tuffex
        run: pnpm build

      - name: Verify npm token
        if: steps.version_check.outputs.should_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN is required."
            exit 1
          fi

          if ! npm whoami >/tmp/npm-whoami.txt 2>/tmp/npm-whoami.err; then
            echo "NPM_TOKEN is configured but npm whoami failed. The token may be expired, revoked, or not valid for registry.npmjs.org."
            cat /tmp/npm-whoami.err
            exit 1
          fi

          npm_user=$(cat /tmp/npm-whoami.txt)
          echo "Authenticated to npm as ${npm_user}."

      - name: Publish to npm
        if: steps.version_check.outputs.should_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-package.mjs --filter "@talex-touch/tuffex" --skip-git-check --skip-build
