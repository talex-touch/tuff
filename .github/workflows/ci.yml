name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  job1:
    name: Check Not Allowed File Changes
    runs-on: ubuntu-latest
    steps:
      - name: Check Not Allowed File Changes
        uses: dorny/paths-filter@v4
        id: filter_not_allowed
        with:
          list-files: json
          filters: |
            change:
              - 'package-lock.json'
              - 'yarn.lock'

      - name: Fail on foreign lockfile changes
        if: ${{ steps.filter_not_allowed.outputs.change == 'true' }}
        run: |
          echo "Foreign lockfile changes are not accepted in this PR workflow:"
          echo '${{ steps.filter_not_allowed.outputs.change_files }}'
          exit 1

  docs_verify:
    name: Documentation Quality
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          cache: true
          install: true

      - name: Setup PNPM
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify documentation
        run: mise run docs:verify


  job_quality_pr:
    name: PR Quality
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PNPM
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run PR quality gate
        run: pnpm quality:pr
