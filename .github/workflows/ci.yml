name: CI

on:
  pull_request:
  # Also on the default branch. Two PRs that each pass independently can break typecheck or a test
  # in combination — a semantic conflict PR-level CI cannot see — and with no run on the merge
  # commit the branch stays broken until the next PR, whose failure then looks like its own (#723).
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  # github.ref for a push, so a master run is not cancelled by an unrelated PR and vice versa.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  job1:
    name: Check Not Allowed File Changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # On a push there is no filtering: the default branch gets the full run, which is the point of
      # validating it at all. paths-filter is also PR-shaped here — it resolves the base through the
      # API and this job has no checkout, so it cannot diff a push (#723).
      release_acceptance: ${{ github.event_name == 'push' && 'true' || steps.filter_not_allowed.outputs.release_acceptance }}
      nexus: ${{ github.event_name == 'push' && 'true' || steps.filter_not_allowed.outputs.nexus }}
    steps:
      - name: Check Not Allowed File Changes
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter_not_allowed
        with:
          list-files: json
          filters: |
            change:
              - 'package-lock.json'
              - 'yarn.lock'
            release_acceptance:
              - 'scripts/**'
              - 'vitest.release-acceptance.config.mjs'
              - '.github/workflows/ci.yml'
            nexus:
              - 'apps/nexus/**'
              - 'packages/tuffex/**'
              - '.github/workflows/ci.yml'

      # A contribution policy, so it only makes sense on the incoming change, not on the branch.
      - name: Fail on foreign lockfile changes
        if: ${{ github.event_name == 'pull_request' && steps.filter_not_allowed.outputs.change == 'true' }}
        run: |
          echo "Foreign lockfile changes are not accepted in this PR workflow:"
          echo '${{ steps.filter_not_allowed.outputs.change_files }}'
          exit 1

  docs_verify:
    name: Documentation Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: job1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: true
          install: true

      - name: Setup PNPM
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify documentation
        run: mise run docs:verify


  job_quality_pr:
    name: PR Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: job1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PNPM
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Needs a completed install: it reads the resolved tree to tell a stale allowlist
      # entry apart from a live one.
      - name: Verify build-script allowlist
        run: pnpm check:build-allowlist

      # Reads LICENSE and the manifests only, so it does not need the install above.
      - name: Verify entry documentation metadata
        run: pnpm check:doc-metadata && pnpm check:doc-metadata:self-test

      # Source-level architecture guard: the search-index worker is the sole writer for
      # files / file_extensions / keyword_mappings (#295, confirmed shipped in #331).
      - name: Verify search-index writer ownership
        run: pnpm -C apps/core-app check:search-index-writers && pnpm -C apps/core-app check:search-index-writers:self-test

      # The script existed but no workflow ran it (#555). ~1s: re-derives the sensitive-data
      # inventory's 28 evidence anchors from the TypeScript AST, so it needs the root
      # `typescript` dependency and nothing else.
      - name: Verify sensitive-data inventory
        run: pnpm privacy:inventory:verify

      # Ran nowhere until now (#554). It also doubles as the resolution check for `tsx`: the
      # binary was undeclared workspace-wide and survived only on `shamefully-hoist=true`
      # until #1099 removed it (#1128). If the declaration this commit adds is wrong, this
      # step is where it shows up rather than in whichever release script runs next.
      - name: Validate plugin manifests and package policy
        run: pnpm plugins:validate

      # `pnpm lint` reaches plugins either as workspaces or through a hand-maintained brace
      # list, and touch-dictation was in neither (#562). The list is the kind that drifts
      # silently, so this asserts the two paths between them still cover every directory.
      - name: Verify plugin lint coverage
        run: pnpm check:plugin-lint-coverage && pnpm check:plugin-lint-coverage:self-test

      # Third-party actions must be SHA-pinned (#546). dtolnay/rust-toolchain@stable was a
      # *branch*, in workflows that also hold NPM_TOKEN, RELEASE_SIGNING_PRIVATE_KEY and the
      # Apple notarization credentials — moving that ref is enough to run someone else's code
      # next to the publishing keys. actions/* is exempt and the check says so.
      - name: Verify action pins
        run: pnpm check:action-pins && pnpm check:action-pins:self-test

      # ${{ }} is substituted into a run: body before bash parses it, so a workflow_dispatch
      # input containing $(…) executes — in the step that had also just written
      # RELEASE_SIGNING_PRIVATE_KEY to disk (#539). Only caller-controlled contexts are
      # policed; steps.*.outputs.* and github.sha are not, or the check would flag dozens of
      # benign lines and get switched off.
      - name: Verify no workflow script injection
        run: pnpm check:workflow-injection && pnpm check:workflow-injection:self-test

      # 17 test files under scripts/ — the release machinery — that no workflow ran (#1135).
      # Three are excluded, each with its reason named in the config: one needs a prior build, and
      # two exercise a macOS-only release-acceptance contract a Linux runner cannot satisfy, so
      # they run in job_release_acceptance instead (#1139). The other 14 run here.
      - name: Run repo-root tooling tests
        run: pnpm test:scripts

      - name: Run PR quality gate
        run: pnpm quality:pr


  job_typecheck_all:
    name: Typecheck (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: job1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PNPM
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # quality:pr only type-checks apps/core-app. typecheck:all covers the rest
      # of the workspaces that declare a typecheck script; see #553.
      - name: Run workspace typecheck
        run: pnpm typecheck:all

  # The release-acceptance contract only holds on an Apple-silicon Mac: update-downgrade
  # evidence may claim `executionMode: runtime` for darwin/arm64 and nothing else
  # (scripts/lib/update-downgrade-evidence.mjs:122). Those two files are therefore excluded
  # from the Linux script-test gate, which left the contract untested anywhere (#1139).
  #
  # Gated on job1's path filter so unrelated pull requests spend no macOS minutes — the
  # runner costs ~10x a Linux one, and these tests only matter when scripts/ moves.
  job_release_acceptance:
    name: Release acceptance (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    needs: job1
    if: ${{ needs.job1.outputs.release_acceptance == 'true' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PNPM
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails loudly rather than passing vacuously if GitHub ever moves macos-latest back to
      # Intel: the tests would then be skipped by the very rule they exist to enforce.
      - name: Confirm the runner is the acceptance host
        run: |
          node -e "
            const { platform, arch } = process
            if (platform !== 'darwin' || arch !== 'arm64') {
              console.error('release acceptance expects darwin/arm64, got ' + platform + '/' + arch)
              process.exit(1)
            }
            console.log('acceptance host: ' + platform + '/' + arch)
          "

      - name: Run release-acceptance tests
        run: pnpm test:release-acceptance

  # apps/nexus is the production Cloudflare deployment, and its build and check:* gates ran
  # nowhere (#552). Its `test` and `typecheck` are covered now — by job_app_tests since #924
  # and by typecheck:all since #553 — but a PR could break the Nuxt build or the API route
  # tree and nothing would notice.
  #
  # Path-filtered because the build is the expensive part: it builds tuffex first and asks for
  # an 8GB heap, so it should not sit on every unrelated pull request.
  #
  # Two of the four check:* scripts are deliberately absent, because they are deployment-time
  # checks rather than PR gates and both fail without their inputs:
  #   check:preview-secrets  → exit 64, wants CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN
  #   check:runtime-evidence → exit 1, wants an output/playwright directory from a prior run
  # They belong in the deploy pipeline, next to the secrets and artifacts they read.
  job_nexus:
    name: Nexus (build + checks)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: job1
    if: ${{ needs.job1.outputs.nexus == 'true' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PNPM
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Both verified passing on a clean tree before being wired: the route-tree check exits 0
      # with "server/api route tree verified", the fence check exits 0 silently.
      - name: Verify server API route tree
        run: pnpm -C apps/nexus check:api-routes

      - name: Verify MDC fences
        run: pnpm -C apps/nexus check:mdc-fences

      # Blocking. It was briefly continue-on-error because wiring it up is what discovered
      # the build was broken — nitro could not resolve @panva/hkdf from next-auth against a
      # root node_modules path that only existed under shamefully-hoist (#1151, #1099
      # fallout). That is fixed by declaring the package, so this goes back to being a gate:
      # apps/nexus is the production Cloudflare deployment and a PR must not be able to
      # break its build silently, which is the state #552 found it in.
      - name: Build
        run: pnpm -C apps/nexus build

  job_app_tests:
    name: App suites (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: job1
    strategy:
      fail-fast: false
      matrix:
        app: [core-app, nexus]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PNPM
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The 623 core-app and 180 nexus test files ran in no workflow at all;
      # only four hand-named core-app files were covered, inside a path-filtered
      # native-protocol job. See #924.
      #
      # nexus is now BLOCKING: 180 files / 963 tests, zero failures (#327 closed).
      # core-app stays non-blocking at 2 failing files, down from 20 (#323). Both
      # remaining failures there are product-side rather than test-side -- the
      # packaged runtime closure shipping openai@6 against @langchain/openai's
      # ^4.87.3, and plugins/touch-quickops having lost its contract tests -- so
      # they need decisions, not an assertion edit, and blocking on them would
      # stop every unrelated PR.
      #
      # The counts are the whole reason for the JUnit report below: a
      # continue-on-error job reports success, so a jump like 20 -> 28 files is
      # invisible unless the numbers are an artifact rather than something you
      # have to scrape out of a 6000-line log.
      # apps/nexus imports @talex-touch/tuffex/utils, whose exports map resolves
      # only into dist/ — without a build those tests fail on module resolution
      # rather than on anything they actually assert.
      - name: Build tuffex
        if: ${{ matrix.app == 'nexus' }}
        run: pnpm -C packages/tuffex build

      - name: Run ${{ matrix.app }} suite
        continue-on-error: ${{ matrix.app != 'nexus' }}
        run: >-
          pnpm -C "apps/${{ matrix.app }}" exec vitest run
          --reporter=default
          --reporter=junit
          --outputFile.junit=../../test-reports/${{ matrix.app }}.junit.xml

      # if: always() — the report is only interesting when the suite failed, and
      # the step above is continue-on-error, so it must not be gated on success.
      - name: Upload ${{ matrix.app }} test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ matrix.app }}
          path: test-reports/${{ matrix.app }}.junit.xml
          retention-days: 7
          if-no-files-found: warn

  # packages/test is the cross-package integration suite and had no workflow at all — the
  # only match for it under .github/workflows was native-protocol.yml, for a different path.
  # #325 wants it as a release gate; it cannot be one yet, so it gets the same treatment #924
  # gave core-app and nexus: run it, do not block on it, and publish the count so a regression
  # against that baseline is visible.
  #
  # Separate job rather than a third matrix entry: the matrix keys on `apps/${{ matrix.app }}`
  # and renaming it to carry a directory would rename the existing checks, which is not this
  # change's business.
  job_integration_tests:
    name: Integration suite (packages/test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: job1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PNPM
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Baseline measured on this runner, which is the number a future run must be compared
      # against: 11 of 27 files and 72 of 240 tests failing. A local darwin run reports
      # 63 of 242 instead — the suite is platform-sensitive, so the local figure would make
      # the first CI run look like a regression. Flip continue-on-error off when this reaches
      # zero; until then the artifact below is the only way a jump is noticeable, because a
      # continue-on-error job reports success either way.
      - name: Run integration suite
        continue-on-error: true
        run: >-
          pnpm -C "packages/test" exec vitest run
          --reporter=default
          --reporter=junit
          --outputFile.junit=../../test-reports/integration.junit.xml

      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-integration
          path: test-reports/integration.junit.xml
          retention-days: 7
          if-no-files-found: warn
