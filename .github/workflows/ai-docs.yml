name: AI Docs

on:
  pull_request:
    paths:
      - mise.toml
      - scripts/ai-docs/**
      - docs/plan-prd/03-features/ai-2.5*.md
      - docs/plan-prd/04-implementation/**
      - docs/plan-prd/TODO.md
      - docs/INDEX.md
      - .github/workflows/ai-docs.yml
  push:
    branches:
      - master
      - main
    paths:
      - mise.toml
      - scripts/ai-docs/**
      - docs/plan-prd/03-features/ai-2.5*.md
      - docs/plan-prd/04-implementation/**
      - docs/plan-prd/TODO.md
      - docs/INDEX.md
      - .github/workflows/ai-docs.yml

permissions:
  contents: read

concurrency:
  group: ai-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          cache: true
          install: true

      - name: Setup PNPM
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify documentation
        run: mise run docs:verify
