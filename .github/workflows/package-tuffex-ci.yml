name: Tuffex Package CI

on:
  pull_request:
    paths:
      - "packages/tuffex/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/package-tuffex-ci.yml"
      - ".github/workflows/package-ci.yml"
  push:
    branches:
      - master
      - main
    paths:
      - "packages/tuffex/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/package-tuffex-ci.yml"
      - ".github/workflows/package-ci.yml"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/package-ci.yml
    with:
      package-name: tuffex
      package-path: packages/tuffex
      run-typecheck: true
      run-lint: true
      run-test: true
      run-build: true
      build-command: pnpm build
