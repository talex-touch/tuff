name: Tuffex Package CI

on:
  pull_request:
    paths:
      - "packages/tuffex/**"
      - "packages/utils/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/package-tuffex-ci.yml"
      - ".github/workflows/package-ci.yml"
  push:
    branches:
      - master
      - main
    paths:
      - "packages/tuffex/**"
      - "packages/utils/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/package-tuffex-ci.yml"
      - ".github/workflows/package-ci.yml"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/package-ci.yml
    with:
      package-name: tuffex
      package-path: packages/tuffex
      run-typecheck: true
      run-lint: true
      run-test: true
      run-build: true
      build-command: pnpm build
      # Only the two that pass today. audit:types is broken by construction and audit:size
      # has been over budget since well before this change -- both tracked in #1555, and
      # wiring them here would land a gate that is red on every PR.
      post-build-command: pnpm audit:exports && pnpm audit:readme && pnpm audit:types
