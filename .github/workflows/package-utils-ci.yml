name: Utils Package CI

on:
  pull_request:
    paths:
      - "packages/utils/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/package-utils-ci.yml"
      - ".github/workflows/package-ci.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "packages/utils/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/package-utils-ci.yml"
      - ".github/workflows/package-ci.yml"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/package-ci.yml
    with:
      package-name: utils
      package-path: packages/utils
      run-lint: true
      lint-command: pnpm lint
      run-test: true
      # Keep the wall-clock benchmark isolated from Vitest's parallel file scheduling.
      test-command: |
        pnpm exec vitest run --exclude "**/*.benchmark.test.ts"
        pnpm benchmark:preview
      # The build emits every public JS entry plus declarations, so it is also the package's
      # effective typecheck. Skipping it leaves new publishConfig exports unverified.
      run-build: true
      build-command: pnpm build
