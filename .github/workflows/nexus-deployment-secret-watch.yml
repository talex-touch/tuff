# Catches a missing production Cloudflare Pages Secret on a schedule instead of at
# incident time.
#
# `NUXT_INTELLIGENCE_ENCRYPT_KEY` was absent from Production long enough for stored
# provider API keys to be unreadable, and the preflight that existed to catch it read
# only the Preview environment — where the four names it checked all happened to be
# present. It was structurally incapable of failing.
#
# The preflight now reads both environments. This runs it. Three facts decide the shape:
#
#   1. Production deploys through the Cloudflare Pages Git integration, not Actions.
#     There is no deploy job here to hang a gate on; `deploy:cf` only covers the
#     preview path.
#   2. The drift is time-based, not commit-based. Deleting a Secret in the Cloudflare
#     dashboard produces no commit, so a PR gate would never run on the change that
#     breaks Production.
#   3. The check reads live Cloudflare state, so it is meaningful on a clock.
#
# Same shape as npm-token-watch.yml, for the same reason: a red cron nobody reads is
# not an alert.
name: Nexus Deployment Secret Watch

on:
  schedule:
    # Mondays 02:30 UTC — half an hour after the NPM token watch so the two do not
    # open issues in the same minute and read as one incident.
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nexus-deployment-secret-watch
  cancel-in-progress: false

jobs:
  check:
    name: Check Pages deployment Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # No `pnpm install`: the preflight imports only `node:fs` and one relative file,
      # so the monorepo install would cost minutes and add a failure mode that has
      # nothing to do with Secret drift. Verified by running it with the workspace
      # uninstalled.
      - name: Run the deployment Secret preflight
        id: check
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: apps/nexus
        run: |
          set -uo pipefail

          # Single line, like npm-token-watch: `name=value` in GITHUB_OUTPUT does not
          # support multiline values, and a rejected output file would skip the alert
          # step that exists to report the failure. Full text stays in the job log.
          emit() {
            printf 'ok=%s\n' "$1" >> "$GITHUB_OUTPUT"
            printf 'classification=%s\n' "$2" >> "$GITHUB_OUTPUT"
            printf 'reason=%s\n' "$(printf '%s' "$3" | tr '\n' ' ' | cut -c1-500)" >> "$GITHUB_OUTPUT"
          }

          output="$(node scripts/deployment-secret-preflight.mjs 2>&1)"
          status=$?
          echo "${output}"

          # Exit codes are a deliberate contract, not incidental:
          #   0  verified
          #   78 real drift — a required Secret is missing, a credential uses
          #      plain_text, or the local-only preview marker is bound remotely
          #   64 this workflow is misconfigured (no Cloudflare credentials)
          #   69 Cloudflare was unreachable or returned unusable metadata
          #
          # Only 78 means Production is actually at risk. Opening the "Production is
          # broken" issue on a transient Cloudflare 5xx would train everyone to
          # ignore it, which is exactly how the original incident stayed invisible.
          case "${status}" in
            0)  emit true ok "verified" ;;
            78) emit false drift "${output}" ;;
            64) emit false misconfigured "${output}" ;;
            *)  emit false unavailable "${output}" ;;
          esac

      - name: Open or refresh the alert issue
        # always() on purpose: a bare `if:` carries an implicit success(), so a crash
        # in the step above would skip the alert instead of reporting it.
        if: always() && steps.check.outputs.classification == 'drift'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.check.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Nexus Cloudflare Pages deployment Secrets have drifted"

          {
            printf '%s\n\n' "The scheduled preflight found a Cloudflare Pages credential problem."
            fence='```'
            printf '%s\n%s\n%s\n\n' "${fence}" "${REASON}" "${fence}"
            cat <<'BODY'
          This is the failure mode that made stored provider API keys unreadable in
          Production: `NUXT_INTELLIGENCE_ENCRYPT_KEY` was missing, and the preflight of the
          day only inspected the Preview environment, so nothing reported it.

          Read the code before acting on it:

          - `DEPLOYMENT_SECRET_INVENTORY_MISSING` — a name in `required` or
            `productionRequired` is absent from that environment. Data encrypted with it is
            unreadable until it is restored with the **same value**; a fresh key does not
            recover existing ciphertext.
          - `DEPLOYMENT_SECRET_BINDING_TYPE_INVALID` — a catalogued credential is bound as
            `plain_text`. Plaintext values are readable in the Cloudflare dashboard and API.
          - `DEPLOYMENT_LOCAL_MARKER_REMOTE_BINDING` — `NEXUS_LOCAL_PAGES_PREVIEW` is bound
            remotely. It is a local-only marker and must never exist in a deployed
            environment.
          - `PREVIEW_DEPLOY_BRANCH_IS_PRODUCTION` — the project's production branch is the
            preview deploy branch. Production would then serve preview builds, so the run
            stops before reporting on Secrets at all.

          The catalog is `apps/nexus/shared/security/deployment-secret-inventory.json`.
          Reproduce locally with `CLOUDFLARE_ACCOUNT_ID` and `CLOUDFLARE_API_TOKEN` set:

          ```bash
          pnpm -C apps/nexus check:deployment-secrets
          ```

          The preflight reads names and binding types only. It never reads, logs, or writes
          a Secret value.
          BODY
            printf '\nChecked by %s\n' "${RUN_URL}"
          } > "${RUNNER_TEMP}/nexus-secret-alert.md"

          existing="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body-file "${RUNNER_TEMP}/nexus-secret-alert.md"
          else
            gh issue create --title "${title}" --body-file "${RUNNER_TEMP}/nexus-secret-alert.md"
          fi

      # Split from the drift case on purpose. A watcher that cannot run is a broken
      # watcher, and silently green is how the original gate stayed trusted while
      # checking nothing — but it is not a Production incident, so it does not open the
      # incident issue.
      - name: Fail the run
        if: always() && steps.check.outputs.ok != 'true'
        env:
          CLASSIFICATION: ${{ steps.check.outputs.classification }}
        run: |
          case "${CLASSIFICATION}" in
            drift)
              echo "Production Secret drift detected; alert issue opened or refreshed." ;;
            misconfigured)
              echo "This workflow is missing CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN." \
                   "The preflight never ran, so Production is unverified — not proven healthy." ;;
            *)
              echo "Cloudflare metadata was unavailable; Production is unverified." ;;
          esac
          exit 1
