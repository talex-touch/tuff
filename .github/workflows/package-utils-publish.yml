name: Utils Package Publish

on:
  push:
    branches:
      - main
      - master
    paths:
      - "packages/utils/package.json"
      - ".github/workflows/package-utils-publish.yml"

concurrency:
  # npm publish is not resumable, so an in-flight run must never be cancelled — queue
  # behind it instead. Without this, two pushes seconds apart both pass the `npm view`
  # existence check, both build, and the loser falls back to the duplicate-publish
  # grep further down this file. Keyed per workflow so the package publishes stay
  # independent of each other.
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  publish:
    name: Publish - utils
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PNPM
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version bump
        id: version_check
        run: |
          set -euo pipefail

          current_version=$(node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('packages/utils/package.json','utf8')); console.log(pkg.version)")
          before_sha="${{ github.event.before }}"

          echo "current_version=${current_version}" >> "$GITHUB_OUTPUT"

          if npm view "@talex-touch/utils@${current_version}" version >/dev/null 2>&1; then
            npm_has_version=true
          else
            npm_has_version=false
          fi
          echo "npm_has_version=${npm_has_version}" >> "$GITHUB_OUTPUT"

          if [ "${before_sha}" = "0000000000000000000000000000000000000000" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A force-push (or any branch rewrite) leaves github.event.before pointing at a
          # commit that is not in the fetched history. Under `set -e`/pipefail an
          # unguarded `git show` then fails the whole version check, so a real version
          # bump in that same push is silently never published. Treat an unreachable
          # before-sha as "no previous version", matching package-tuff-cli-publish.yml.
          if git cat-file -e "${before_sha}^{commit}" >/dev/null 2>&1; then
            previous_version=$(git show "${before_sha}:packages/utils/package.json" 2>/dev/null | node -e "const fs=require('fs'); const input=fs.readFileSync(0,'utf8'); if(!input){process.exit(0)}; const pkg=JSON.parse(input); console.log(pkg.version)" || true)
          else
            echo "Previous commit ${before_sha} is unreachable (force-push?); treating as no previous version."
            previous_version=""
          fi
          echo "previous_version=${previous_version}" >> "$GITHUB_OUTPUT"

          if [ "${current_version}" != "${previous_version}" ] || [ "${npm_has_version}" != "true" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip publish (version unchanged and already on npm)
        if: steps.version_check.outputs.should_publish != 'true'
        run: echo "Utils version unchanged and already published. Skipping publish."

      - name: Run utils tests
        if: steps.version_check.outputs.should_publish == 'true'
        run: pnpm -C "packages/utils" test

      - name: Verify npm token
        if: steps.version_check.outputs.should_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN is required."
            exit 1
          fi

      # Was a bare `npm publish` in packages/utils. npm does not understand pnpm's `catalog:`
      # protocol, so it packed the specifier verbatim — `npm pack` here produces
      # `"gsap": "catalog:"` and `"marked": "catalog:"`, which no consumer can resolve
      # (#1137). publish-package.mjs packs with pnpm, which rewrites the protocol, then hands
      # the finished tarball to `npm publish`; it also runs validate-publish-manifests --pack
      # against that tarball, which every other package already got and this one did not
      # (#551). Dist-tag selection is identical (`next` for prereleases) and the
      # already-published check is built in.
      - name: Publish to npm
        if: steps.version_check.outputs.should_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-package.mjs --filter "@talex-touch/utils" --skip-git-check --skip-tests
