name: Native Protocol

on:
  # No workflow-level `paths:` on pull_request: a path-filtered workflow never reports a check on
  # unrelated PRs, which leaves a required check stuck in "Expected" forever (#1794). Instead,
  # the `changes` job filters PR files so `protocol` skips cleanly and the `Protocol` aggregator
  # job still reports `success`.
  pull_request:
  push:
    # `master` is this repository's default branch; there is no `main`. Every other workflow
    # that guards a branch lists both names, so this trigger was the only one that never fired.
    branches:
      - master
    paths:
      - '.github/workflows/native-protocol.yml'
      - 'apps/core-app/src/main/modules/native-capabilities/**'
      - 'packages/test/src/native/**'
      - 'packages/tuff-native/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

concurrency:
  group: native-protocol-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Native Protocol Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.native }}
    steps:
      - name: Detect relevant file changes
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            native:
              - '.github/workflows/native-protocol.yml'
              - 'apps/core-app/src/main/modules/native-capabilities/**'
              - 'packages/test/src/native/**'
              - 'packages/tuff-native/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  protocol:
    name: Protocol (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.native == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev
          libclang-dev
          libdbus-1-dev
          libegl-dev
          libgbm-dev
          libpipewire-0.3-dev
          libwayland-dev
          libxcb1-dev
          libxcb-randr0-dev
          libxdo-dev
          libxkbcommon-dev
          libxrandr-dev
          pkg-config

      # Pinned explicitly instead of tracking dtolnay/rust-toolchain's floating `stable` branch so
      # upstream clippy releases cannot silently redden master under `-D warnings` (#1794). Keep
      # this version aligned with build-and-release.yml and windows-everything-production.yml.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: '1.100.0'
          components: rustfmt, clippy

      - name: Cache Rust workspace
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: packages/tuff-native

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Rust formatting
        run: cargo fmt --manifest-path packages/tuff-native/Cargo.toml --all -- --check

      - name: Lint Rust workspace
        run: cargo clippy --manifest-path packages/tuff-native/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Test Rust workspace
        run: cargo test --manifest-path packages/tuff-native/Cargo.toml --workspace

      - name: Build Rust workspace release addons
        run: cargo build --manifest-path packages/tuff-native/Cargo.toml --workspace --release

      - name: Build production screenshot addon and verify exports
        run: >-
          pnpm -C packages/tuff-native run build:screenshot &&
          pnpm -C packages/tuff-native run test:screenshot-protocol &&
          pnpm -C packages/tuff-native run verify:screenshot-production

      # native-audio is already a member of packages/tuff-native/Cargo.toml, so the cargo
      # fmt/clippy/test/build steps above have always covered the crate on all three runners.
      # What nothing ran was build:audio -- the step that copies the compiled library to
      # build/Release/tuff_native_audio.node, which is the artifact audio.js actually opens.
      # So the crate could compile while the addon the runtime loads was never produced (#322).
      #
      # The verifier passes on a runner with no microphone and fails when the module is absent:
      # it separates reasons the native module produces (no-input-device, input-probe-failed,
      # platform-not-supported) from reasons the JS wrapper produces when the binding is missing.
      - name: Build production audio addon and verify it loads
        run: >-
          pnpm -C packages/tuff-native run build:audio &&
          pnpm -C packages/tuff-native run verify:audio-production

      - name: Build Chrome Native Messaging host
        run: node packages/tuff-native/scripts/build-browser-bridge.js

      - name: Build and test Rust OCR helper
        run: >-
          pnpm -C packages/tuff-native run build:ocr &&
          pnpm -C packages/tuff-native run test:ocr-helper

      - name: Build and test Rust file-index addon
        run: >-
          pnpm -C packages/tuff-native run build:file-index &&
          pnpm -C packages/tuff-native run test:file-index

      - name: Build deterministic screenshot addon
        env:
          TUFF_SCREENSHOT_PROTOCOL_TEST_BACKEND: '1'
        run: pnpm -C packages/tuff-native run build:screenshot

      - name: Test screenshot N-API transport integration
        run: >-
          pnpm -C apps/core-app exec vitest run
          src/main/modules/native-capabilities/native-screenshot-transport-napi.integration.test.ts

      - name: Restore and verify production screenshot addon
        run: >-
          pnpm -C packages/tuff-native run build:screenshot &&
          pnpm -C packages/tuff-native run test:screenshot-protocol &&
          pnpm -C packages/tuff-native run verify:screenshot-production

      # This workflow already filters on packages/test/src/native/** but never ran it, so a
      # change there triggered a job that could not observe it. Run it here, where the addon
      # has just been built, and demand the binding loads -- the integration suite tolerates
      # its absence because it does not build Rust, and that tolerance is only safe if some
      # job insists on the real thing.
      # Named files rather than the directory, and the suite's own guard fails if a file appears
      # in src/native without being listed here -- so coverage cannot quietly shrink back.
      #
      # tuff-native-ocr.test.ts was excluded while Windows OCR read nothing from a fixture that
      # had been built and validated against Apple Vision, on the only platform that ever ran it.
      # The fixture now carries antialiased edges rather than hard-edged 704x248 block letters,
      # which is the first of the three candidates in #1517 and the only one testable without a
      # Windows desktop. This step is the test of that: if the Windows leg is green, the fixture
      # was the problem.
      - name: Test native carriers from the integration suite
        env:
          TUFF_NATIVE_SCREENSHOT_REQUIRED: '1'
          # Forbids the OCR test's early return. Without it a green Windows leg cannot be told
          # apart from one that never reached the engine -- which is the gap #1517 is about.
          #
          # Off on Linux, where getNativeOcrSupport() reports platform-not-supported: there is
          # no native OCR to reach, so demanding one there asserts a platform fact rather than
          # coverage. Learned by demanding it everywhere and watching the ubuntu leg go red.
          TUFF_NATIVE_OCR_REQUIRED: ${{ runner.os == 'Linux' && '0' || '1' }}
          TUFF_NATIVE_ACTIVE_APP_REQUIRED: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: >-
          pnpm -C packages/test exec vitest run
          src/native/tuff-native-active-app.test.ts
          src/native/tuff-native-audio.test.ts
          src/native/tuff-native-ocr.test.ts
          src/native/tuff-native-screenshot.test.ts

      - name: Verify packed native package contents
        run: pnpm -C packages/tuff-native pack --dry-run

      - name: Build protocol fixture addon
        run: pnpm -C packages/tuff-native run build:protocol-fixture

      - name: Test protocol contracts
        run: pnpm -C packages/tuff-native run test:protocol

      - name: Test main-process transport integration
        run: >-
          pnpm -C apps/core-app exec vitest run
          src/main/modules/native-capabilities/native-transport.test.ts
          src/main/modules/native-capabilities/native-transport-stream.test.ts
          src/main/modules/native-capabilities/native-transport-napi.integration.test.ts

      - name: Type-check Electron main process
        # The type graph genuinely needs about 2.8 GB: 4,660 files, 2,793 of them
        # dependency declarations, led by @sentry, typebox, drizzle-orm and openai.
        # skipLibCheck is already on, so there is no configuration lever left -- the
        # macOS runner's default heap is simply below what this check costs, and it
        # died with FatalProcessOutOfMemory rather than reporting a type error.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm -C apps/core-app run typecheck:node

  # Single required-check target for `master` branch protection (#1794). Always reports a
  # conclusion: `success` when no native paths changed (skipping the 3-OS Rust matrix), `success`
  # when all three matrix legs passed, and `failure` when change detection or any leg fails.
  protocol_gate:
    name: Protocol
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, protocol]
    if: ${{ always() }}
    steps:
      - name: Evaluate native protocol gate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          NATIVE_CHANGED: ${{ needs.changes.outputs.native }}
          PROTOCOL_RESULT: ${{ needs.protocol.result }}
        run: |
          echo "changes=${CHANGES_RESULT} native=${NATIVE_CHANGED} protocol=${PROTOCOL_RESULT}"
          if [[ "${CHANGES_RESULT}" != "success" ]]; then
            echo "::error::Native Protocol change detection did not succeed (${CHANGES_RESULT})."
            exit 1
          fi
          if [[ "${NATIVE_CHANGED}" != "true" ]]; then
            echo "No native protocol paths changed; Protocol gate satisfied without running Rust matrix."
            exit 0
          fi
          if [[ "${PROTOCOL_RESULT}" != "success" ]]; then
            echo "::error::Protocol matrix did not succeed (${PROTOCOL_RESULT})."
            exit 1
          fi
